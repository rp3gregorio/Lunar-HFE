<svg viewBox="0 0 760 600" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <title>Full retrieval pipeline — data to K_d</title>
  <desc>Master flow diagram: Apollo HFE stable-window temperatures and the published Hayne model feed a per-trial forward solve (heat equation to certified steady state); the sweep over K_d minimises deep-sensor RMSE to give K_d*; bootstrap + MCMC + AICc quantify uncertainty. Each box names its inputs and its outputs in symbols.</desc>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000"/>
    </marker>
  </defs>

  <text x="40" y="32" font-size="15" font-style="italic" fill="#000">From the raw record to a number: the full pipeline</text>
  <line x1="40" y1="42" x2="400" y2="42" stroke="#000" stroke-width="0.7"/>

  <!-- ============== INPUTS COLUMN (left) ============== -->
  <text x="50" y="80" font-size="13" font-weight="700" fill="#000">INPUTS</text>

  <!-- Input 1: Apollo HFE data -->
  <rect x="40" y="90" width="200" height="76" fill="#FFF" stroke="#000" stroke-width="1.2"/>
  <text x="50" y="110" font-size="13" font-weight="700" fill="#000">1.  Apollo HFE data</text>
  <text x="50" y="128" font-size="12" font-style="italic" fill="#000">T(z, t) at each sensor, 1971–77</text>
  <text x="50" y="146" font-size="12" fill="#555">Nagihara (2018), restored record</text>
  <text x="50" y="160" font-size="11" font-style="italic" fill="#555">code: src/lunar/apollo_helpers.py</text>

  <!-- Input 2: Hayne model -->
  <rect x="40" y="186" width="200" height="92" fill="#FFF" stroke="#000" stroke-width="1.2"/>
  <text x="50" y="206" font-size="13" font-weight="700" fill="#000">2.  Hayne (2017) K(T,z)</text>
  <text x="50" y="224" font-size="12" font-style="italic" fill="#000">K = [K_d − (K_d−K_s) e^(−z/H)]</text>
  <text x="60" y="240" font-size="12" font-style="italic" fill="#000">× [1 + χ(T/T_ref)³]</text>
  <text x="50" y="258" font-size="12" fill="#555">fixed:  K_s,  H,  χ,  T_ref</text>
  <text x="50" y="272" font-size="12" font-style="italic" fill="#555">free knob:  K_d</text>

  <!-- Input 3: Q_b -->
  <rect x="40" y="298" width="200" height="58" fill="#FFF" stroke="#000" stroke-width="1.2"/>
  <text x="50" y="318" font-size="13" font-weight="700" fill="#000">3.  basal heat flux Q_b</text>
  <text x="50" y="336" font-size="12" fill="#000">21 mW/m² (A15),  15 mW/m² (A17)</text>
  <text x="50" y="350" font-size="11" font-style="italic" fill="#555">Langseth et al. (1976)</text>

  <!-- ============== PROCESS COLUMN (center) ============== -->
  <text x="320" y="80" font-size="13" font-weight="700" fill="#000">PROCESS</text>

  <!-- Step A: extract T_eq -->
  <rect x="310" y="90" width="220" height="58" fill="#FFF" stroke="#000" stroke-width="1.2"/>
  <text x="320" y="110" font-size="13" font-weight="700" fill="#000">A.  Stable window  ->  T_eq</text>
  <text x="320" y="128" font-size="12" font-style="italic" fill="#000">deep sensors only  (z &gt; 80 cm)</text>
  <text x="320" y="142" font-size="11" fill="#555">7 points (A15),  16 points (A17)</text>

  <!-- Step B: forward solve -->
  <rect x="310" y="168" width="220" height="118" fill="#FFF" stroke="#000" stroke-width="1.2"/>
  <text x="320" y="188" font-size="13" font-weight="700" fill="#000">B.  Forward solve  ->  T(z; K_d)</text>
  <text x="320" y="206" font-size="12" fill="#000">solve the heat equation</text>
  <text x="332" y="222" font-size="12" font-style="italic" fill="#000">ρ c_p ∂T/∂t = ∂_z (K ∂_z T)</text>
  <text x="320" y="240" font-size="12" fill="#000">to a certified periodic</text>
  <text x="320" y="254" font-size="12" fill="#000">steady state  (flux-anchored).</text>
  <text x="320" y="276" font-size="11" font-style="italic" fill="#555">src/lunar/{solver,equilibrium}.py</text>

  <!-- Step C: sweep -->
  <rect x="310" y="306" width="220" height="74" fill="#FFF" stroke="#000" stroke-width="1.2"/>
  <text x="320" y="326" font-size="13" font-weight="700" fill="#000">C.  Sweep K_d, minimise</text>
  <text x="320" y="344" font-size="12" font-style="italic" fill="#000">RMSE(K_d) = √[ mean( (T_model − T_eq)² ) ]</text>
  <text x="320" y="362" font-size="12" fill="#000">parabolic vertex  ->  K_d*</text>
  <text x="320" y="376" font-size="11" font-style="italic" fill="#555">pipeline/compute/retrieve_kd.py</text>

  <!-- Step D: stats -->
  <rect x="310" y="400" width="220" height="76" fill="#FFF" stroke="#000" stroke-width="1.2"/>
  <text x="320" y="420" font-size="13" font-weight="700" fill="#000">D.  Uncertainty</text>
  <text x="320" y="438" font-size="12" fill="#000">bootstrap (1500×),  MCMC,  AICc,</text>
  <text x="320" y="452" font-size="12" fill="#000">error budget (Q_b, A, K_s, …)</text>
  <text x="320" y="470" font-size="11" font-style="italic" fill="#555">pipeline/compute/compute_*.py</text>

  <!-- ============== OUTPUTS COLUMN (right) ============== -->
  <text x="590" y="80" font-size="13" font-weight="700" fill="#000">RESULTS</text>

  <rect x="580" y="90" width="160" height="58" fill="#FFF" stroke="#000" stroke-width="1.4"/>
  <text x="590" y="110" font-size="12" fill="#000">retrieved K_d*</text>
  <text x="590" y="128" font-size="14" font-style="italic" font-weight="700" fill="#000">A15:  4.58</text>
  <text x="590" y="144" font-size="14" font-style="italic" font-weight="700" fill="#000">A17:  8.12</text>

  <rect x="580" y="168" width="160" height="58" fill="#FFF" stroke="#000" stroke-width="1.2"/>
  <text x="590" y="188" font-size="12" fill="#000">95% bootstrap CI</text>
  <text x="590" y="206" font-size="12" font-style="italic" fill="#000">A15: [4.12, 7.45]</text>
  <text x="590" y="220" font-size="12" font-style="italic" fill="#000">A17: [6.85, 9.04]</text>

  <rect x="580" y="246" width="160" height="58" fill="#FFF" stroke="#000" stroke-width="1.2"/>
  <text x="590" y="266" font-size="12" fill="#000">inter-site contrast</text>
  <text x="590" y="284" font-size="12" font-style="italic" fill="#000">A17 − A15 = 3.31</text>
  <text x="590" y="298" font-size="11" fill="#555">p ≈ 0.011</text>

  <rect x="580" y="324" width="160" height="58" fill="#FFF" stroke="#000" stroke-width="1.2"/>
  <text x="590" y="344" font-size="12" fill="#000">total 1σ budget</text>
  <text x="590" y="362" font-size="12" font-style="italic" fill="#000">A15: ± 1.75</text>
  <text x="590" y="376" font-size="12" font-style="italic" fill="#000">A17: ± 4.61</text>

  <!-- ============== ARROWS ============== -->
  <!-- inputs -> processes -->
  <line x1="240.0" y1="128.0" x2="297.1" y2="120.1" stroke="#000" stroke-width="1.2" /><polygon points="305.0,119.0 297.6,124.1 296.5,116.1" fill="#000"/>
  <line x1="240.0" y1="232.0" x2="297.1" y2="223.2" stroke="#000" stroke-width="1.2" /><polygon points="305.0,222.0 297.7,227.2 296.5,219.3" fill="#000"/>
  <line x1="240.0" y1="232.0" x2="297.1" y2="242.5" stroke="#000" stroke-width="1.2" /><polygon points="305.0,244.0 296.4,246.5 297.9,238.6" fill="#000"/>
  <line x1="240.0" y1="326.0" x2="299.7" y2="258.0" stroke="#000" stroke-width="1.2" /><polygon points="305.0,252.0 302.7,260.7 296.7,255.4" fill="#000"/>

  <!-- processes downward -->
  <line x1="420.0" y1="148.0" x2="420.0" y2="158.0" stroke="#000" stroke-width="1.5" /><polygon points="420.0,166.0 416.0,158.0 424.0,158.0" fill="#000"/>
  <line x1="420.0" y1="286.0" x2="420.0" y2="296.0" stroke="#000" stroke-width="1.5" /><polygon points="420.0,304.0 416.0,296.0 424.0,296.0" fill="#000"/>
  <line x1="420.0" y1="380.0" x2="420.0" y2="390.0" stroke="#000" stroke-width="1.5" /><polygon points="420.0,398.0 416.0,390.0 424.0,390.0" fill="#000"/>

  <!-- A -> output? no, A feeds B too (T_eq is the target the sweep minimises) -->
  <line x1="430" y1="148" x2="430" y2="166" stroke="#000" stroke-width="0" />
  <!-- A loops to C (sweep) as the comparison target -->
  <path d="M530,119 C580,119 580,330 530,335" fill="none" stroke="#000" stroke-width="0.9" stroke-dasharray="4 3"/>
  <text x="555" y="220" font-size="11" font-style="italic" fill="#555" text-anchor="middle">T_eq</text>
  <text x="555" y="234" font-size="11" font-style="italic" fill="#555" text-anchor="middle">target</text>

  <!-- processes -> results -->
  <line x1="530.0" y1="345.0" x2="573.4" y2="127.8" stroke="#000" stroke-width="1.1" /><polygon points="575.0,120.0 577.4,128.6 569.5,127.1" fill="#000"/>
  <line x1="530.0" y1="438.0" x2="573.5" y2="202.9" stroke="#000" stroke-width="1.1" /><polygon points="575.0,195.0 577.5,203.6 569.6,202.1" fill="#000"/>
  <line x1="530.0" y1="438.0" x2="572.9" y2="282.7" stroke="#000" stroke-width="1.1" /><polygon points="575.0,275.0 576.7,283.8 569.0,281.6" fill="#000"/>
  <line x1="530.0" y1="438.0" x2="571.4" y2="357.1" stroke="#000" stroke-width="1.1" /><polygon points="575.0,350.0 574.9,358.9 567.8,355.3" fill="#000"/>

  <!-- ============== FOOTER ============== -->
  <line x1="40" y1="510" x2="720" y2="510" stroke="#000" stroke-width="0.6"/>
  <text x="40" y="532" font-size="13" font-weight="700" fill="#000">Read it like a sentence:</text>
  <text x="40" y="552" font-size="12" font-style="italic" fill="#000">Apollo data give us per-sensor equilibrium temperatures.  Hayne's K(T,z) gives</text>
  <text x="40" y="568" font-size="12" font-style="italic" fill="#000">the conductivity shape  (with one free knob, K_d).  Solving the heat equation forward</text>
  <text x="40" y="584" font-size="12" font-style="italic" fill="#000">with Q_b at the base lets us, for every trial K_d, draw T(z) — and find the K_d that fits.</text>
</svg>
