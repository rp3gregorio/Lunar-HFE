<rect x="50" y="155" width="285" height="62" rx="8" fill="#FFF3E6" stroke="#B85B3A" stroke-width="1.2"/>
<text x="64" y="178" font-size="13" letter-spacing="1.5" fill="#B85B3A" font-weight="700">AT THE SURFACE</text>
<text x="64" y="200" font-size="13" fill="#3A2C1F">First cell: <tspan font-weight="700">2 mm</tspan> — resolves the daily wave</text>
<line x1="335" y1="186" x2="360" y2="186" stroke="#B85B3A" stroke-width="1.2"/>
<rect x="50" y="280" width="285" height="62" rx="8" fill="#FAF6EF" stroke="#D6CFC0" stroke-width="1"/>
<text x="64" y="303" font-size="13" letter-spacing="1.5" fill="#5E574E" font-weight="700">THE GROWTH RULE</text>
<text x="64" y="325" font-size="13" fill="#3A2C1F">Each cell is ~<tspan font-weight="700">8% thicker</tspan> than the one above</text>
<rect x="50" y="415" width="285" height="62" rx="8" fill="#E8F1F4" stroke="#2A6478" stroke-width="1.2"/>
<text x="64" y="438" font-size="13" letter-spacing="1.5" fill="#2A6478" font-weight="700">AT DEPTH</text>
<text x="64" y="460" font-size="13" fill="#1B4A5A">~<tspan font-weight="700">2 cm</tspan> by 0.5 m; ~<tspan font-weight="700">5 cm</tspan> by 1 m</text>
<line x1="335" y1="446" x2="360" y2="446" stroke="#2A6478" stroke-width="1.2"/>
<rect x="600" y="490" width="260" height="62" rx="8" fill="#FAF6EF" stroke="#D6CFC0" stroke-width="1"/>
<text x="612" y="514" font-size="12" letter-spacing="1.5" fill="#5E574E" font-weight="700">EFFICIENCY</text>
<text x="612" y="534" font-size="12" fill="#3A2C1F">~69 cells span the full 5 m column;</text>
<text x="612" y="550" font-size="12" fill="#3A2C1F">a uniform 2 mm grid would need ~2500.</text>
</svg>