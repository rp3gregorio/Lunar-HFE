<svg viewBox="0 0 760 446" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <title>Apollo 15 HFE probe geometry</title>
  <desc>Side-view: two boreholes in hatched regolith; cables to a small HFE electronics box at the surface; borestem (hatched) in the top 30 cm; shallow sensors as open circles, deep sensors as filled circles. A legend box in the top right gives the symbol key; an inset below it magnifies one sensor bridge.</desc>
  <defs>
    <pattern id="borestem" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Regolith hatching (single direction) -->
  <line x1="100" y1="86" x2="90" y2="96" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="122" y1="86" x2="90" y2="118" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="144" y1="86" x2="90" y2="140" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="166" y1="86" x2="90" y2="162" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="188" y1="86" x2="90" y2="184" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="210" y1="86" x2="90" y2="206" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="232" y1="86" x2="90" y2="228" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="254" y1="86" x2="90" y2="250" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="276" y1="86" x2="90" y2="272" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="298" y1="86" x2="90" y2="294" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="320" y1="86" x2="90" y2="316" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="342" y1="86" x2="90" y2="338" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="364" y1="86" x2="90" y2="360" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="386" y1="86" x2="90" y2="382" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="408" y1="86" x2="108" y2="386" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="430" y1="86" x2="130" y2="386" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="440" y1="98" x2="152" y2="386" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="440" y1="120" x2="174" y2="386" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="440" y1="142" x2="196" y2="386" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="440" y1="164" x2="218" y2="386" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="440" y1="186" x2="240" y2="386" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="440" y1="208" x2="262" y2="386" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="440" y1="230" x2="284" y2="386" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="440" y1="252" x2="306" y2="386" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="440" y1="274" x2="328" y2="386" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="440" y1="296" x2="350" y2="386" stroke="#000" stroke-width="0.4" opacity="0.32"/>

  <!-- surface line -->
  <line x1="90" y1="86" x2="440" y2="86" stroke="#000" stroke-width="1.6"/>
  <text x="446" y="90" font-size="13" font-style="italic" fill="#000">surface</text>

  <!-- HFE electronics box + cables -->
  <rect x="230" y="48" width="80" height="28" fill="#FFFFFF" stroke="#000" stroke-width="1.2"/>
  <text x="270" y="65" font-size="11" fill="#000" text-anchor="middle">HFE</text>
  <text x="270" y="74" font-size="9.5" fill="#000" text-anchor="middle" font-style="italic">electronics</text>
  <path d="M245,76 C 220,84 225,86 200,86" fill="none" stroke="#000" stroke-width="1"/>
  <path d="M295,76 C 320,84 315,86 340,86" fill="none" stroke="#000" stroke-width="1"/>

  <!-- Depth ruler -->
  <line x1="88" y1="86" x2="88" y2="386" stroke="#000" stroke-width="1"/>
  <g font-size="12" fill="#000" text-anchor="end">
    <line x1="83" y1="86.0"   x2="93" y2="86.0"   stroke="#000" stroke-width="1"/><text x="80" y="90.0">0</text>
    <line x1="83" y1="148.5"  x2="93" y2="148.5"  stroke="#000" stroke-width="1"/><text x="80" y="152.5">50</text>
    <line x1="83" y1="211.0" x2="93" y2="211.0" stroke="#000" stroke-width="1"/><text x="80" y="215.0">100</text>
    <line x1="83" y1="273.5" x2="93" y2="273.5" stroke="#000" stroke-width="1"/><text x="80" y="277.5">150</text>
    <line x1="83" y1="336.0" x2="93" y2="336.0" stroke="#000" stroke-width="1"/><text x="80" y="340.0">200</text>
    <text x="80" y="404" font-style="italic">z (cm)</text>
  </g>

  <!-- 80 cm cut line: dashed across the whole drawing zone, label on the FAR LEFT outside the regolith -->
  <line x1="90" y1="186.0" x2="440" y2="186.0" stroke="#000" stroke-width="0.9" stroke-dasharray="4 3"/>

  <!-- PROBE 1 (left): borestem (0-30 cm) + body to 140 cm + tip arrow -->
  <rect x="196" y="86.0" width="8" height="37.5" fill="url(#borestem)" stroke="#000" stroke-width="0.8"/>
  <line x1="200" y1="123.5" x2="200" y2="261.0" stroke="#000" stroke-width="1.7"/>
  <polygon points="196,258.0 204,258.0 200,269.0" fill="#000"/>
  <!-- shallow (open) sensors near 65-67 cm -->
  <circle cx="200" cy="168.5" r="3.6" fill="#FFF" stroke="#000" stroke-width="1.1"/>
  <!-- deep sensors  -->
  <circle cx="200" cy="193.5" r="4" fill="#000"/>
  <circle cx="200" cy="231.0" r="4" fill="#000"/>
  <circle cx="200" cy="258.5" r="4" fill="#000"/>
  <text x="200" y="416" font-size="13" font-style="italic" fill="#000" text-anchor="middle">Probe 1</text>
  <text x="200" y="432" font-size="11" fill="#555" text-anchor="middle">to 140 cm</text>

  <!-- PROBE 2: borestem + body to 234 cm + tip arrow -->
  <rect x="336" y="86.0" width="8" height="37.5" fill="url(#borestem)" stroke="#000" stroke-width="0.8"/>
  <line x1="340" y1="123.5" x2="340" y2="378.5" stroke="#000" stroke-width="1.7"/>
  <polygon points="336,375.5 344,375.5 340,386.5" fill="#000"/>
  <circle cx="340" cy="168.5" r="3.6" fill="#FFF" stroke="#000" stroke-width="1.1"/>
  <circle cx="340" cy="248.5" r="4" fill="#000"/>
  <circle cx="340" cy="261.0" r="4" fill="#000"/>
  <circle cx="340" cy="294.8" r="4" fill="#000"/>
  <circle cx="340" cy="308.5" r="4" fill="#000"/>
  <circle cx="340" cy="329.8" r="4" fill="#000"/>
  <circle cx="340" cy="364.8" r="4" fill="#000"/>
  <text x="340" y="416" font-size="13" font-style="italic" fill="#000" text-anchor="middle">Probe 2</text>
  <text x="340" y="432" font-size="11" fill="#555" text-anchor="middle">to 234 cm</text>

  <!-- ============== LEGEND BOX (top-right) ============== -->
  <rect x="475" y="92" width="240" height="118" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
  <text x="595" y="111" font-size="13" font-weight="700" fill="#000" text-anchor="middle">Key</text>
  <line x1="490" y1="118" x2="700" y2="118" stroke="#000" stroke-width="0.6"/>

  <!-- key entry: borestem -->
  <rect x="495" y="128" width="14" height="14" fill="url(#borestem)" stroke="#000" stroke-width="0.7"/>
  <text x="516" y="140" font-size="12" fill="#000">epoxy borestem (top 30 cm)</text>
  <!-- key entry: shallow sensor -->
  <circle cx="502" cy="156" r="4" fill="#FFF" stroke="#000" stroke-width="1.1"/>
  <text x="516" y="160" font-size="12" fill="#000">shallow sensor — excluded</text>
  <!-- key entry: deep sensor -->
  <circle cx="502" cy="176" r="4" fill="#000"/>
  <text x="516" y="180" font-size="12" fill="#000">deep sensor — sets K<tspan font-style="italic">d</tspan></text>
  <!-- key entry: dashed cut -->
  <line x1="495" y1="196" x2="509" y2="196" stroke="#000" stroke-width="0.9" stroke-dasharray="3 2"/>
  <text x="516" y="200" font-size="12" fill="#000">z = 80 cm (borestem cut)</text>

  <!-- ============== MAGNIFIED INSET (below legend) ============== -->
  <rect x="475" y="230" width="240" height="160" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
  <text x="595" y="248" font-size="12" font-weight="700" fill="#000" text-anchor="middle">One sensor — magnified</text>
  <line x1="490" y1="255" x2="700" y2="255" stroke="#000" stroke-width="0.6"/>

  <!-- two probe-tube sections, joined by gradient bridge -->
  <rect x="560" y="268" width="70" height="40" fill="#FFFFFF" stroke="#000" stroke-width="1.2"/>
  <rect x="560" y="338" width="70" height="40" fill="#FFFFFF" stroke="#000" stroke-width="1.2"/>
  <line x1="595" y1="308" x2="595" y2="338" stroke="#000" stroke-width="2.4"/>
  <line x1="585" y1="316" x2="605" y2="316" stroke="#000" stroke-width="1.4"/>
  <line x1="585" y1="328" x2="605" y2="328" stroke="#000" stroke-width="1.4"/>
  <!-- labels -->
  <line x1="555" y1="288" x2="540" y2="288" stroke="#000" stroke-width="0.6"/>
  <text x="535" y="292" font-size="11" font-style="italic" fill="#000" text-anchor="end">probe tube</text>
  <line x1="555" y1="322" x2="540" y2="322" stroke="#000" stroke-width="0.6"/>
  <text x="535" y="326" font-size="11" font-style="italic" fill="#000" text-anchor="end">bridge</text>
  <line x1="635" y1="358" x2="650" y2="358" stroke="#000" stroke-width="0.6"/>
  <text x="654" y="362" font-size="11" font-style="italic" fill="#000">probe tube</text>
  <text x="595" y="388" font-size="11" font-style="italic" fill="#555" text-anchor="middle">~50 cm vertical separation</text>

  <!-- leader from probe 2's middle deep sensor to inset -->
  <line x1="345" y1="294.8" x2="475" y2="280" stroke="#000" stroke-width="0.6" stroke-dasharray="3 3"/>

</svg>