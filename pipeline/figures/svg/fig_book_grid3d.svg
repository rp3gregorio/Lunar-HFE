<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
<title>The geometric depth grid</title>
<desc>A column of regolith split into cells that are 2 mm thick at the surface and grow about 8% per layer, reaching tens of centimetres at depth.</desc>
<text x="40" y="40" font-size="20" font-weight="700" fill="#2A2520">The geometric grid: millimetres up top, decimetres below</text>
<rect x="300" y="80.0" width="150" height="3.30" fill="#F2E5D6" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="83.3" width="150" height="3.75" fill="#ECDDCC" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="87.0" width="150" height="4.25" fill="#E6D4C3" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="91.3" width="150" height="4.83" fill="#E0CCBA" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="96.1" width="150" height="5.48" fill="#D9C3B1" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="101.6" width="150" height="6.22" fill="#D3BBA8" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="107.8" width="150" height="7.06" fill="#CDB29E" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="114.9" width="150" height="8.01" fill="#C7AA95" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="122.9" width="150" height="9.09" fill="#C1A18C" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="132.0" width="150" height="10.32" fill="#BB9983" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="142.3" width="150" height="11.71" fill="#B59079" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="154.0" width="150" height="13.29" fill="#AF8870" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="167.3" width="150" height="15.09" fill="#A97F67" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="182.4" width="150" height="17.12" fill="#A3775E" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="199.5" width="150" height="19.43" fill="#9D6E55" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="218.9" width="150" height="22.06" fill="#97664B" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="241.0" width="150" height="25.03" fill="#915D42" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="266.0" width="150" height="28.41" fill="#8B5539" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="294.4" width="150" height="32.25" fill="#844C30" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="326.7" width="150" height="36.60" fill="#7E4426" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="363.3" width="150" height="41.55" fill="#783B1D" stroke="#FFFFFF" stroke-width="0.6"/><rect x="300" y="404.8" width="150" height="47.15" fill="#723314" stroke="#FFFFFF" stroke-width="0.6"/>
<line x1="450" y1="82" x2="472" y2="82" stroke="#6E6862" stroke-width="0.8"/><text x="478" y="86" font-size="13" fill="#2A2520">2 mm at the surface</text>
<line x1="450" y1="251" x2="472" y2="251" stroke="#6E6862" stroke-width="0.8"/><text x="478" y="255" font-size="13" fill="#2A2520">~9 cm by 1 m</text>
<line x1="450" y1="385" x2="472" y2="385" stroke="#6E6862" stroke-width="0.8"/><text x="478" y="389" font-size="13" fill="#2A2520">~20 cm by 2 m</text>
<text x="262" y="154" font-size="13" fill="#B85B3A" font-weight="700" text-anchor="end">fine: resolves</text>
<text x="262" y="172" font-size="13" fill="#B85B3A" font-weight="700" text-anchor="end">the daily wave</text>
<text x="262" y="348" font-size="13" fill="#2A6478" font-weight="700" text-anchor="end">coarse: cheap</text>
<text x="262" y="366" font-size="13" fill="#2A6478" font-weight="700" text-anchor="end">where T is flat</text>
<text x="262" y="255" font-size="12" fill="#6E6862" font-style="italic" text-anchor="end">each cell ~8% thicker</text>
<text x="40" y="466" font-size="12.5" fill="#6E6862">~69 cells span the full 5 m column; a uniform 2 mm grid would need ~2500.</text>
</svg>