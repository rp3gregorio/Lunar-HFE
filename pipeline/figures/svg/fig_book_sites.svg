<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <title>Comparison of the two Apollo HFE sites</title>
  <desc>Two simple side-by-side schematics: each shows the local surface line, a vertical probe with its deepest sensor as a filled circle at the correct fractional depth, the basal flux arrow rising from below, and the retrieved K_d underneath. Black on white.</desc>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000"/>
    </marker>
  </defs>

  <line x1="320" y1="20" x2="320" y2="300" stroke="#000" stroke-width="0.6" stroke-dasharray="3 3"/>

  <g>
    <text x="160" y="40" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Apollo 15  —  Hadley Rille</text>
    <line x1="50" y1="80" x2="270" y2="80" stroke="#000" stroke-width="1.4"/>
    <line x1="160" y1="80" x2="160" y2="180" stroke="#000" stroke-width="1.4"/>
    <circle cx="160" cy="180" r="4" fill="#000"/>
    <text x="170" y="184" font-size="12" font-style="italic" fill="#000">1.39 m</text>
    <line x1="160.0" y1="280.0" x2="160.0" y2="227.0" stroke="#000" stroke-width="1.2" /><polygon points="160.0,220.0 164.0,227.0 156.0,227.0" fill="#000"/>
    <text x="170" y="252" font-size="13" font-style="italic" fill="#000">Q<tspan dy="3" font-size="10">b</tspan> = 21 mW/m²</text>
    <text x="160" y="306" font-size="16" font-style="italic" fill="#000" text-anchor="middle">Kd* = 4.58</text>
    <text x="160" y="322" font-size="12" fill="#000" text-anchor="middle">mW / (m · K)</text>
  </g>

  <g>
    <text x="480" y="40" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Apollo 17  —  Taurus–Littrow</text>
    <line x1="370" y1="80" x2="590" y2="80" stroke="#000" stroke-width="1.4"/>
    <line x1="480" y1="80" x2="480" y2="220" stroke="#000" stroke-width="1.4"/>
    <circle cx="480" cy="220" r="4" fill="#000"/>
    <text x="490" y="224" font-size="12" font-style="italic" fill="#000">2.34 m</text>
    <line x1="480.0" y1="280.0" x2="480.0" y2="247.0" stroke="#000" stroke-width="1.2" /><polygon points="480.0,240.0 484.0,247.0 476.0,247.0" fill="#000"/>
    <text x="490" y="262" font-size="13" font-style="italic" fill="#000">Q<tspan dy="3" font-size="10">b</tspan> = 15 mW/m²</text>
    <text x="480" y="306" font-size="16" font-style="italic" fill="#000" text-anchor="middle">Kd* = 8.12</text>
    <text x="480" y="322" font-size="12" fill="#000" text-anchor="middle">mW / (m · K)</text>
  </g>
</svg>
