<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
<title>The geometric depth grid</title>
<desc>A vertical column of regolith split into geometric cells: 2 mm at the surface, growing 8% per layer; ~56 cells span the first metre.</desc>
<text x="50" y="46" font-size="13" letter-spacing="2" fill="#8C8378">DISCRETIZATION</text>
<text x="50" y="78" font-size="24" font-weight="700" fill="#2A2520">The geometric depth grid</text>
<line x1="50" y1="92" x2="180" y2="92" stroke="#B85B3A" stroke-width="3"/>
<text x="50" y="116" font-size="13.5" fill="#5E574E" font-style="italic">Millimetres at the surface, decimetres below — fine where it matters, cheap where it doesn't.</text>
