<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <title>Apollo 15 HFE probe geometry</title>
  <desc>Side-view schematic: ground surface (horizontal line); two vertical boreholes; the upper 30 cm of each probe is a borestem (shown with hatched lines); deep sensors below 80 cm are filled circles, shallow excluded sensors are open. Depth ruler on the left.</desc>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="0.7"/>
    </pattern>
  </defs>

  <line x1="80" y1="80" x2="600" y2="80" stroke="#000" stroke-width="1.4"/>
  <text x="608" y="84" font-size="14" font-style="italic" fill="#000">surface</text>

  <line x1="78" y1="80" x2="78" y2="350" stroke="#000" stroke-width="1"/>
  <g font-size="12" fill="#000" text-anchor="end">
    <line x1="73" y1="80"  x2="83" y2="80"  stroke="#000" stroke-width="1"/><text x="70" y="84">0</text>
    <line x1="73" y1="134" x2="83" y2="134" stroke="#000" stroke-width="1"/><text x="70" y="138">50</text>
    <line x1="73" y1="188" x2="83" y2="188" stroke="#000" stroke-width="1"/><text x="70" y="192">100</text>
    <line x1="73" y1="244" x2="83" y2="244" stroke="#000" stroke-width="1"/><text x="70" y="248">150</text>
    <line x1="73" y1="298" x2="83" y2="298" stroke="#000" stroke-width="1"/><text x="70" y="302">200</text>
    <text x="70" y="338" font-style="italic">z (cm)</text>
  </g>

  <line x1="80" y1="166" x2="600" y2="166" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="100" y="162" font-size="12" font-style="italic" fill="#555">z = 80 cm  (borestem cut)</text>

  <g>
    <line x1="220" y1="80" x2="220" y2="280" stroke="#000" stroke-width="1.4"/>
    <rect x="216" y="80" width="8" height="36" fill="url(#hatch)" stroke="#000" stroke-width="0.6"/>
    <circle cx="220" cy="151" r="3.5" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="220" cy="160" r="3.5" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="220" cy="220" r="4" fill="#000"/>
    <circle cx="220" cy="230" r="4" fill="#000"/>
    <circle cx="220" cy="278" r="4" fill="#000"/>
    <text x="232" y="282" font-size="13" font-style="italic" fill="#000">probe 1  (140 cm)</text>
  </g>

  <g>
    <line x1="440" y1="80" x2="440" y2="338" stroke="#000" stroke-width="1.4"/>
    <rect x="436" y="80" width="8" height="36" fill="url(#hatch)" stroke="#000" stroke-width="0.6"/>
    <circle cx="440" cy="151" r="3.5" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="440" cy="160" r="3.5" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="440" cy="220" r="4" fill="#000"/>
    <circle cx="440" cy="230" r="4" fill="#000"/>
    <circle cx="440" cy="265" r="4" fill="#000"/>
    <circle cx="440" cy="275" r="4" fill="#000"/>
    <circle cx="440" cy="300" r="4" fill="#000"/>
    <circle cx="440" cy="310" r="4" fill="#000"/>
    <circle cx="440" cy="335" r="4" fill="#000"/>
    <text x="452" y="339" font-size="13" font-style="italic" fill="#000">probe 2  (234 cm)</text>
  </g>

  <g font-size="13" fill="#000">
    <line x1="350" y1="98" x2="232" y2="98" stroke="#000" stroke-width="0.9"/>
    <text x="355" y="102" font-style="italic">epoxy borestem (top 30 cm)</text>

    <line x1="350" y1="225" x2="232" y2="225" stroke="#000" stroke-width="0.9"/>
    <text x="355" y="229" font-style="italic">deep sensors — these set Kd</text>

    <line x1="305" y1="156" x2="232" y2="156" stroke="#000" stroke-width="0.9"/>
    <text x="310" y="160" font-style="italic" fill="#555">shallow sensors (excluded)</text>
  </g>
</svg>
