<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <title>Control volume — heat balance on a thin slab</title>
  <desc>Wireframe slab in oblique projection: q(z) enters the top, q(z+Δz) leaves the base; Δz marks the cell thickness, A the cross-sectional area. Black-line textbook style.</desc>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000"/>
    </marker>
  </defs>

  <rect x="160" y="170" width="200" height="110" fill="none" stroke="#000" stroke-width="1.4"/>
  <line x1="220" y1="130" x2="420" y2="130" stroke="#000" stroke-width="1.1"/>
  <line x1="420" y1="130" x2="420" y2="240" stroke="#000" stroke-width="1.1"/>
  <line x1="160" y1="170" x2="220" y2="130" stroke="#000" stroke-width="1.1"/>
  <line x1="360" y1="170" x2="420" y2="130" stroke="#000" stroke-width="1.1"/>
  <line x1="360" y1="280" x2="420" y2="240" stroke="#000" stroke-width="1.1"/>
  <line x1="160" y1="280" x2="220" y2="240" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="220" y1="240" x2="420" y2="240" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="220" y1="130" x2="220" y2="240" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/>

  <line x1="260.0" y1="80.0" x2="260.0" y2="148.0" stroke="#000" stroke-width="1.4" /><polygon points="260.0,155.0 256.0,148.0 264.0,148.0" fill="#000"/>
  <line x1="260.0" y1="285.0" x2="260.0" y2="328.0" stroke="#000" stroke-width="1.4" /><polygon points="260.0,335.0 256.0,328.0 264.0,328.0" fill="#000"/>

  <text x="270" y="118" font-size="16" font-style="italic" fill="#000">q(z)</text>
  <text x="270" y="333" font-size="16" font-style="italic" fill="#000">q(z + Δz)</text>

  <line x1="438" y1="130" x2="448" y2="130" stroke="#000" stroke-width="1"/>
  <line x1="438" y1="240" x2="448" y2="240" stroke="#000" stroke-width="1"/>
  <line x1="443" y1="130" x2="443" y2="240" stroke="#000" stroke-width="1"/>
  <text x="453" y="188" font-size="16" font-style="italic" fill="#000">Δz</text>

  <text x="290" y="158" font-size="14" font-style="italic" fill="#555">A</text>
</svg>
