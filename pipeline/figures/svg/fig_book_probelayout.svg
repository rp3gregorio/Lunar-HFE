<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <title>Apollo 15 HFE probe geometry — detailed</title>
  <desc>Side-view: two boreholes in cross-hatched regolith; the top 30 cm of each probe is the epoxy borestem; surface cable links both probes to the HFE electronics box; open circles mark excluded shallow sensors, filled circles mark deep sensors. A magnified inset shows one gradient bridge between probe sections.</desc>
  <defs>
    <pattern id="borestem" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Regolith hatching (one direction; explicit lines) -->
  <line x1="100" y1="86" x2="80" y2="106" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="122" y1="86" x2="80" y2="128" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="144" y1="86" x2="80" y2="150" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="166" y1="86" x2="80" y2="172" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="188" y1="86" x2="80" y2="194" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="210" y1="86" x2="80" y2="216" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="232" y1="86" x2="80" y2="238" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="254" y1="86" x2="80" y2="260" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="276" y1="86" x2="80" y2="282" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="298" y1="86" x2="80" y2="304" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="320" y1="86" x2="80" y2="326" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="342" y1="86" x2="80" y2="348" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="364" y1="86" x2="80" y2="370" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="386" y1="86" x2="96" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="408" y1="86" x2="118" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="430" y1="86" x2="140" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="452" y1="86" x2="162" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="474" y1="86" x2="184" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="496" y1="86" x2="206" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="518" y1="86" x2="228" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="540" y1="86" x2="250" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="562" y1="86" x2="272" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="580" y1="90" x2="294" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="580" y1="112" x2="316" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="580" y1="134" x2="338" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="580" y1="156" x2="360" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="580" y1="178" x2="382" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="580" y1="200" x2="404" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="580" y1="222" x2="426" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="580" y1="244" x2="448" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="580" y1="266" x2="470" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>
  <line x1="580" y1="288" x2="492" y2="376" stroke="#000" stroke-width="0.4" opacity="0.32"/>

  <!-- surface line -->
  <line x1="80" y1="86" x2="600" y2="86" stroke="#000" stroke-width="1.6"/>
  <text x="608" y="90" font-size="13" font-style="italic" fill="#000">surface</text>

  <!-- HFE electronics box + cables -->
  <rect x="290" y="48" width="80" height="28" fill="#FFFFFF" stroke="#000" stroke-width="1.2"/>
  <text x="330" y="65" font-size="11" fill="#000" text-anchor="middle">HFE</text>
  <text x="330" y="73" font-size="9.5" fill="#000" text-anchor="middle" font-style="italic">electronics</text>
  <path d="M295,76 C 270,84 245,86 220,86" fill="none" stroke="#000" stroke-width="1"/>
  <path d="M365,76 C 390,84 415,86 440,86" fill="none" stroke="#000" stroke-width="1"/>

  <!-- depth ruler -->
  <line x1="78" y1="86" x2="78" y2="356" stroke="#000" stroke-width="1"/>
  <g font-size="12" fill="#000" text-anchor="end">
    <line x1="73" y1="86"  x2="83" y2="86"  stroke="#000" stroke-width="1"/><text x="70" y="90">0</text>
    <line x1="73" y1="140" x2="83" y2="140" stroke="#000" stroke-width="1"/><text x="70" y="144">50</text>
    <line x1="73" y1="194" x2="83" y2="194" stroke="#000" stroke-width="1"/><text x="70" y="198">100</text>
    <line x1="73" y1="250" x2="83" y2="250" stroke="#000" stroke-width="1"/><text x="70" y="254">150</text>
    <line x1="73" y1="304" x2="83" y2="304" stroke="#000" stroke-width="1"/><text x="70" y="308">200</text>
    <text x="70" y="345" font-style="italic">z (cm)</text>
  </g>

  <!-- 80 cm cut line -->
  <line x1="80" y1="172" x2="500" y2="172" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="92" y="168" font-size="12" font-style="italic" fill="#555">z = 80 cm  (borestem cut)</text>

  <!-- PROBE 1 (left) -->
  <g>
    <rect x="216" y="86" width="8" height="34" fill="url(#borestem)" stroke="#000" stroke-width="0.8"/>
    <line x1="220" y1="120" x2="220" y2="240" stroke="#000" stroke-width="1.6"/>
    <polygon points="216,238 224,238 220,250" fill="#000"/>
    <circle cx="220" cy="156" r="3.5" fill="#FFF" stroke="#000" stroke-width="1.1"/>
    <circle cx="220" cy="164" r="3.5" fill="#FFF" stroke="#000" stroke-width="1.1"/>
    <circle cx="220" cy="208" r="4" fill="#000"/>
    <circle cx="220" cy="216" r="4" fill="#000"/>
    <circle cx="220" cy="234" r="4" fill="#000"/>
    <text x="232" y="252" font-size="13" font-style="italic" fill="#000">probe 1  (140 cm)</text>
  </g>

  <!-- PROBE 2 (right) -->
  <g>
    <rect x="436" y="86" width="8" height="34" fill="url(#borestem)" stroke="#000" stroke-width="0.8"/>
    <line x1="440" y1="120" x2="440" y2="338" stroke="#000" stroke-width="1.6"/>
    <polygon points="436,336 444,336 440,348" fill="#000"/>
    <circle cx="440" cy="156" r="3.5" fill="#FFF" stroke="#000" stroke-width="1.1"/>
    <circle cx="440" cy="164" r="3.5" fill="#FFF" stroke="#000" stroke-width="1.1"/>
    <circle cx="440" cy="208" r="4" fill="#000"/>
    <circle cx="440" cy="216" r="4" fill="#000"/>
    <circle cx="440" cy="248" r="4" fill="#000"/>
    <circle cx="440" cy="256" r="4" fill="#000"/>
    <circle cx="440" cy="288" r="4" fill="#000"/>
    <circle cx="440" cy="296" r="4" fill="#000"/>
    <circle cx="440" cy="332" r="4" fill="#000"/>
    <text x="452" y="349" font-size="13" font-style="italic" fill="#000">probe 2  (234 cm)</text>
  </g>

  <!-- annotation leader lines (with white scrim under labels for legibility against hatching) -->
  <g font-size="12" fill="#000">
    <line x1="248" y1="103" x2="232" y2="103" stroke="#000" stroke-width="0.8"/>
    <rect x="250" y="94" width="170" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="252" y="107" font-style="italic">epoxy borestem (top 30 cm)</text>

    <line x1="248" y1="160" x2="232" y2="160" stroke="#000" stroke-width="0.8"/>
    <rect x="250" y="151" width="170" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="252" y="164" font-style="italic" fill="#555">shallow sensors (excluded)</text>

    <line x1="248" y1="212" x2="232" y2="212" stroke="#000" stroke-width="0.8"/>
    <rect x="250" y="203" width="200" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="252" y="216" font-style="italic">deep sensors — these set Kd</text>
  </g>

  <!-- Magnified sensor inset (white background scrim) -->
  <rect x="558" y="198" width="128" height="154" fill="#FFFFFF" stroke="none"/>
  <g transform="translate(560,200)">
    <rect x="0" y="0" width="124" height="150" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
    <text x="62" y="16" font-size="11" font-style="italic" fill="#000" text-anchor="middle">one sensor — magnified</text>
    <rect x="46" y="28" width="32" height="38" fill="#FFFFFF" stroke="#000" stroke-width="1.1"/>
    <rect x="46" y="86" width="32" height="38" fill="#FFFFFF" stroke="#000" stroke-width="1.1"/>
    <line x1="62" y1="66" x2="62" y2="86" stroke="#000" stroke-width="2.2"/>
    <line x1="56" y1="73" x2="68" y2="73" stroke="#000" stroke-width="1.4"/>
    <line x1="56" y1="79" x2="68" y2="79" stroke="#000" stroke-width="1.4"/>
    <line x1="40" y1="73" x2="20" y2="73" stroke="#000" stroke-width="0.7"/>
    <text x="16" y="69" font-size="10" font-style="italic" fill="#000" text-anchor="end">upper</text>
    <text x="16" y="80" font-size="10" font-style="italic" fill="#000" text-anchor="end">bridge</text>
    <line x1="84" y1="46" x2="104" y2="46" stroke="#000" stroke-width="0.7"/>
    <text x="106" y="50" font-size="10" font-style="italic" fill="#000">probe</text>
    <text x="106" y="62" font-size="10" font-style="italic" fill="#000">tube</text>
    <text x="62" y="142" font-size="10" font-style="italic" fill="#555" text-anchor="middle">~50 cm vertical separation</text>
  </g>
  <line x1="444" y1="212" x2="555" y2="220" stroke="#000" stroke-width="0.6" stroke-dasharray="3 3"/>

</svg>