<svg viewBox="0 0 820 410" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <title>How the Sun heats the rotating Moon</title>
  <desc>The Sun lights the day side of the Moon (which orbits Earth); the borehole site rotates from the hot day side into the cold night and back, once per lunar day.</desc>
  <defs>
    <marker id="sun" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#E3A12C"/>
    </marker>
  </defs>

  <text x="40" y="38" font-size="21" font-weight="700" fill="#2A2520">How the Sun heats the rotating Moon</text>

  <!-- Moon's orbit around Earth -->
  <circle cx="430" cy="205" r="172" fill="none" stroke="#9A938A" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="430" y="28" font-size="13" fill="#6E6862" text-anchor="middle">the Moon's orbit</text>

  <!-- Sun + rays -->
  <circle cx="64" cy="205" r="42" fill="#E3A12C"/>
  <g stroke="#E3A12C" stroke-width="2.2">
    <line x1="64" y1="150" x2="64" y2="135"/><line x1="64" y1="260" x2="64" y2="275"/>
    <line x1="20" y1="180" x2="6" y2="172"/><line x1="20" y1="230" x2="6" y2="238"/>
    <line x1="108" y1="180" x2="122" y2="172"/><line x1="108" y1="230" x2="122" y2="238"/>
  </g>
  <text x="64" y="290" font-size="14" fill="#2A2520" text-anchor="middle" font-weight="700">Sun</text>
  <!-- sunlight striking the day side -->
  <g stroke="#E3A12C" stroke-width="2.4" marker-end="url(#sun)">
    <line x1="135" y1="165" x2="548" y2="165"/>
    <line x1="135" y1="205" x2="548" y2="205"/>
    <line x1="135" y1="245" x2="548" y2="245"/>
  </g>

  <!-- Earth -->
  <circle cx="430" cy="205" r="15" fill="#3A6B8A" stroke="#fff" stroke-width="1.2"/>
  <text x="430" y="240" font-size="13" fill="#2A2520" text-anchor="middle">Earth</text>

  <!-- Moon: lit (left) + night (right) halves -->
  <path d="M605,157 A48,48 0 0 0 605,253 Z" fill="#B85B3A" stroke="#2A2520" stroke-width="1.4"/>
  <path d="M605,157 A48,48 0 0 1 605,253 Z" fill="#2A6478" stroke="#2A2520" stroke-width="1.4"/>
  <line x1="605" y1="157" x2="605" y2="253" stroke="#2A2520" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="605" y="276" font-size="14" fill="#2A2520" text-anchor="middle" font-weight="700">Moon</text>

  <!-- borehole site on the lit side -->
  <line x1="572" y1="170" x2="560" y2="156" stroke="#2A2520" stroke-width="2"/>
  <circle cx="572" cy="170" r="6" fill="#3D6E4A" stroke="#fff" stroke-width="1.2"/>

  <!-- rotation hint -->
  <path d="M640,140 A30,30 0 0 1 612,124" fill="none" stroke="#6E6862" stroke-width="1.6" marker-end="url(#sun)"/>
  <text x="666" y="150" font-size="12" fill="#6E6862">rotation</text>

  <!-- labels -->
  <text x="548" y="112" font-size="13.5" fill="#B85B3A" font-weight="700" text-anchor="middle">day side ~390 K</text>
  <text x="708" y="262" font-size="13.5" fill="#2A6478" font-weight="700">night side ~100 K</text>
  <g font-size="12.5" fill="#3D6E4A">
    <line x1="500" y1="120" x2="568" y2="166" stroke="#6E6862" stroke-width="0.9"/>
    <text x="498" y="116" text-anchor="end" font-weight="700">borehole site</text>
  </g>
  <text x="430" y="392" font-size="13.5" fill="#2A2520" text-anchor="middle">The site turns to face the Sun, then away, once per lunar day (29.5 days).</text>
</svg>
