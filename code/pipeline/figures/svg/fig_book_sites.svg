<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <title>Comparison of the two Apollo HFE sites</title>
  <desc>Two simple side-by-side schematics, with the surface line, vertical probe to deepest sensor, basal flux arrow, and retrieved K_d shown under each. Black on white textbook style.</desc>

  <!-- vertical divider between the two cards -->
  <line x1="380" y1="20" x2="380" y2="300" stroke="#000" stroke-width="0.6" stroke-dasharray="3 3"/>

  <!-- =========== Apollo 15 card =========== -->
  <text x="190" y="32" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Apollo 15 — Hadley Rille (mare)</text>

  <!-- ground surface, hatched -->
  <line x1="50" y1="78" x2="330" y2="78" stroke="#000" stroke-width="1.6"/>
  <g stroke="#000" stroke-width="0.55" opacity="0.45">
    <line x1="62"  y1="78" x2="50"  y2="92"/><line x1="82"  y1="78" x2="68"  y2="94"/>
    <line x1="102" y1="78" x2="88"  y2="94"/><line x1="122" y1="78" x2="108" y2="94"/>
    <line x1="142" y1="78" x2="128" y2="94"/><line x1="162" y1="78" x2="148" y2="94"/>
    <line x1="182" y1="78" x2="168" y2="94"/><line x1="202" y1="78" x2="188" y2="94"/>
    <line x1="222" y1="78" x2="208" y2="94"/><line x1="242" y1="78" x2="228" y2="94"/>
    <line x1="262" y1="78" x2="248" y2="94"/><line x1="282" y1="78" x2="268" y2="94"/>
    <line x1="302" y1="78" x2="288" y2="94"/><line x1="322" y1="78" x2="308" y2="94"/>
    <line x1="330" y1="86" x2="320" y2="96"/>
  </g>

  <!-- probe (centered) -->
  <line x1="190" y1="78" x2="190" y2="200" stroke="#000" stroke-width="2.4"/>
  <circle cx="190" cy="200" r="6" fill="#000" stroke="#fff" stroke-width="1.2"/>
  <text x="200" y="204" font-size="13" font-style="italic" fill="#000">1.39 m</text>

  <!-- basal flux arrow rising from below -->
  <line x1="190" y1="270" x2="190" y2="225" stroke="#000" stroke-width="1.6"/>
  <polygon points="186,225 194,225 190,213" fill="#000"/>
  <text x="200" y="252" font-size="13" font-style="italic" fill="#000">Q_b = 21 mW/m²</text>

  <!-- retrieved K_d* readout -->
  <text x="190" y="286" font-size="17" font-style="italic" fill="#000" text-anchor="middle">Kd* = 4.63</text>
  <text x="190" y="302" font-size="12" fill="#000" text-anchor="middle">mW / (m·K)</text>

  <!-- =========== Apollo 17 card =========== -->
  <text x="570" y="32" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Apollo 17 — Taurus–Littrow (highland)</text>

  <line x1="430" y1="78" x2="710" y2="78" stroke="#000" stroke-width="1.6"/>
  <g stroke="#000" stroke-width="0.55" opacity="0.45">
    <line x1="442" y1="78" x2="430" y2="92"/><line x1="462" y1="78" x2="448" y2="94"/>
    <line x1="482" y1="78" x2="468" y2="94"/><line x1="502" y1="78" x2="488" y2="94"/>
    <line x1="522" y1="78" x2="508" y2="94"/><line x1="542" y1="78" x2="528" y2="94"/>
    <line x1="562" y1="78" x2="548" y2="94"/><line x1="582" y1="78" x2="568" y2="94"/>
    <line x1="602" y1="78" x2="588" y2="94"/><line x1="622" y1="78" x2="608" y2="94"/>
    <line x1="642" y1="78" x2="628" y2="94"/><line x1="662" y1="78" x2="648" y2="94"/>
    <line x1="682" y1="78" x2="668" y2="94"/><line x1="702" y1="78" x2="688" y2="94"/>
    <line x1="710" y1="86" x2="700" y2="96"/>
  </g>

  <!-- probe (centered, drawn deeper to 234 cm) -->
  <line x1="570" y1="78" x2="570" y2="232" stroke="#000" stroke-width="2.4"/>
  <circle cx="570" cy="232" r="6" fill="#000" stroke="#fff" stroke-width="1.2"/>
  <text x="580" y="236" font-size="13" font-style="italic" fill="#000">2.34 m</text>

  <line x1="570" y1="270" x2="570" y2="252" stroke="#000" stroke-width="1.6"/>
  <polygon points="566,252 574,252 570,242" fill="#000"/>
  <text x="580" y="266" font-size="13" font-style="italic" fill="#000">Q_b = 16 mW/m²</text>

  <text x="570" y="286" font-size="17" font-style="italic" fill="#000" text-anchor="middle">Kd* = 7.18</text>
  <text x="570" y="302" font-size="12" fill="#000" text-anchor="middle">mW / (m·K)</text>

  <!-- centred "2x better" marker -->
  <line x1="335" y1="180" x2="425" y2="180" stroke="#000" stroke-width="1.4"/>
  <polygon points="425,180 419,176 419,184" fill="#000"/>
  <text x="380" y="174" font-size="13" font-style="italic" fill="#000" text-anchor="middle">×2 better</text>
</svg>
