<svg viewBox="0 0 760 940" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <title>Equation flow — every equation in sequence, inputs to result</title>
  <desc>A vertical flow chart showing how every equation in the study feeds the next: from inputs (Hayne parameters, Q_b, Apollo data) through the conductivity, boundary conditions, heat equation, and forward solve to T(z; K_d), then through RMSE and the parabolic vertex to K_d*, and finally through the bootstrap to the 95% confidence interval and contrast p-value.</desc>

  <!-- Title strip -->
  <text x="40" y="32" font-size="15" font-style="italic" fill="#000">Equation flow: from inputs to the final K_d*</text>
  <line x1="40" y1="42" x2="500" y2="42" stroke="#000" stroke-width="0.7"/>

  <!-- =============== LEVEL 1: INPUTS =============== -->
  <text x="40" y="74" font-size="12" font-weight="700" fill="#555">INPUTS  (the knobs and the data)</text>
  <rect x="40"  y="82" width="220" height="56" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="50"  y="100" font-size="12" font-style="italic" fill="#000">Apollo HFE record</text>
  <text x="50"  y="116" font-size="12" font-style="italic" fill="#000">T_obs(z, t)  for each sensor</text>
  <text x="50"  y="130" font-size="11" fill="#555">Nagihara (2018)</text>

  <rect x="280" y="82" width="220" height="56" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="290" y="100" font-size="12" font-style="italic" fill="#000">Hayne (2017) parameters</text>
  <text x="290" y="116" font-size="12" font-style="italic" fill="#000">K_s,  H,  chi,  T_ref</text>
  <text x="290" y="130" font-size="11" fill="#555">fixed at published values</text>

  <rect x="520" y="82" width="200" height="56" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="530" y="100" font-size="12" font-style="italic" fill="#000">Trial conductivity</text>
  <text x="530" y="116" font-size="12" font-style="italic" font-weight="700" fill="#000">K_d  (the one free knob)</text>
  <text x="530" y="130" font-size="11" fill="#555">swept over a grid</text>

  <rect x="40"  y="148" width="220" height="44" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="50"  y="166" font-size="12" font-style="italic" fill="#000">Basal flux  Q_b</text>
  <text x="50"  y="182" font-size="11" fill="#555">Langseth et al. (1976) — fixed</text>

  <rect x="280" y="148" width="220" height="44" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="290" y="166" font-size="12" font-style="italic" fill="#000">Surface forcing  S(t), A, eps</text>
  <text x="290" y="182" font-size="11" fill="#555">cosine model + Hayne albedo</text>

  <rect x="520" y="148" width="200" height="44" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="530" y="166" font-size="12" font-style="italic" fill="#000">rho(z), c_p(T)</text>
  <text x="530" y="182" font-size="11" fill="#555">Hayne (rho)  +  Hemingway (c_p)</text>

  <!-- =============== LEVEL 2: data prep =============== -->
  <text x="40" y="222" font-size="12" font-weight="700" fill="#555">DATA PREP</text>
  <rect x="40"  y="230" width="300" height="56" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="50"  y="248" font-size="13" font-weight="700" fill="#000">Stable-window selection</text>
  <text x="50"  y="266" font-size="12" font-style="italic" fill="#000">T_eq,i  =  mean of trailing flat tail of T_obs</text>
  <text x="50"  y="282" font-size="11" fill="#555">apollo_helpers.find_stable_window  ->  N deep points</text>

  <!-- arrow from input box 1 down to data prep -->
  <line x1="150" y1="138" x2="150" y2="228" stroke="#000" stroke-width="1"/>
  <polygon points="150,232 146,224 154,224" fill="#000"/>

  <!-- =============== LEVEL 3: constitutive + BCs =============== -->
  <text x="40" y="320" font-size="12" font-weight="700" fill="#555">CONSTITUTIVE  +  BOUNDARY CONDITIONS</text>

  <!-- Eq 3.1: contact conductivity -->
  <rect x="40"  y="328" width="320" height="62" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="50"  y="346" font-size="12" font-weight="700" fill="#000">Eq 3.1  — Hayne contact conductivity</text>
  <text x="50"  y="368" font-size="14" font-style="italic" fill="#000">K_c(z)  =  K_d  −  (K_d − K_s) e^(−z/H)</text>
  <text x="50"  y="384" font-size="11" fill="#555">depends on K_d, K_s, H</text>

  <!-- Eq 3.2: full K(T,z) -->
  <rect x="400" y="328" width="320" height="62" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="410" y="346" font-size="12" font-weight="700" fill="#000">Eq 3.2  — full K(T,z)</text>
  <text x="410" y="368" font-size="14" font-style="italic" fill="#000">K(T,z)  =  K_c(z) * [1 + chi (T/T_ref)^3]</text>
  <text x="410" y="384" font-size="11" fill="#555">adds the radiative correction  (chi, T_ref)</text>

  <!-- 3.1 -> 3.2 -->
  <line x1="360" y1="362" x2="395" y2="362" stroke="#000" stroke-width="1.1"/>
  <polygon points="395,358 403,362 395,366" fill="#000"/>

  <!-- Eq 2.7: surface BC -->
  <rect x="40"  y="406" width="320" height="62" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="50"  y="424" font-size="12" font-weight="700" fill="#000">Eq 2.7  — surface energy balance  (top BC)</text>
  <text x="50"  y="446" font-size="13" font-style="italic" fill="#000">(1 − A) S(t)  =  eps sigma T_s^4  +  K d_z T |_{z=0}</text>
  <text x="50"  y="462" font-size="11" fill="#555">non-linear in T_s  ->  solved by Newton</text>

  <!-- Eq 2.8: basal BC -->
  <rect x="400" y="406" width="320" height="62" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="410" y="424" font-size="12" font-weight="700" fill="#000">Eq 2.8  — basal flux  (bottom BC)</text>
  <text x="410" y="446" font-size="14" font-style="italic" fill="#000">K  d_z T |_{z = z_max}  =  Q_b</text>
  <text x="410" y="462" font-size="11" fill="#555">Q_b fixed from Langseth (1976)</text>

  <!-- =============== LEVEL 4: the PDE =============== -->
  <text x="40" y="500" font-size="12" font-weight="700" fill="#555">FORWARD SOLVE  (the heat equation)</text>

  <rect x="40"  y="508" width="680" height="118" fill="#FFF" stroke="#000" stroke-width="1.4"/>
  <text x="50"  y="528" font-size="13" font-weight="700" fill="#000">Eq 2.2  — heat equation</text>
  <text x="190" y="552" font-size="16" font-style="italic" fill="#000">rho(z) c_p(T)  dT/dt  =  d_z [ K(T,z) d_z T ]</text>
  <text x="50"  y="578" font-size="12" fill="#000">discretised:  Crank–Nicolson tridiagonal matrix  ->  Thomas algorithm  ->  Newton (surface)</text>
  <text x="50"  y="598" font-size="12" fill="#000">iterated to a certified periodic steady state  (flux-anchored, §5.4)</text>
  <text x="50"  y="616" font-size="12" font-style="italic" font-weight="700" fill="#000">output:  T(z, t; K_d)  ->  cycle mean  &lt;T&gt;(z; K_d)</text>

  <!-- arrows from constitutive + BC boxes converging to PDE -->
  <line x1="560" y1="390" x2="560" y2="506" stroke="#000" stroke-width="1"/>
  <polygon points="560,510 556,502 564,502" fill="#000"/>
  <line x1="200" y1="470" x2="200" y2="506" stroke="#000" stroke-width="1"/>
  <polygon points="200,510 196,502 204,502" fill="#000"/>

  <!-- =============== LEVEL 5: RETRIEVAL =============== -->
  <text x="40" y="660" font-size="12" font-weight="700" fill="#555">RETRIEVAL  (compare prediction with data)</text>

  <!-- Eq 6.1: RMSE -->
  <rect x="40"  y="668" width="340" height="74" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="50"  y="686" font-size="12" font-weight="700" fill="#000">Eq 6.1  — deep-sensor RMSE</text>
  <text x="50"  y="710" font-size="14" font-style="italic" fill="#000">RMSE(K_d)  =  sqrt[ (1/N) Sum ( &lt;T&gt;(z_i; K_d) − T_eq,i )^2 ]</text>
  <text x="50"  y="728" font-size="11" fill="#555">function of K_d, evaluated for every trial</text>

  <!-- Eq 6.2: parabolic vertex -->
  <rect x="400" y="668" width="320" height="74" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="410" y="686" font-size="12" font-weight="700" fill="#000">Eq 6.2  — parabolic vertex refinement</text>
  <text x="410" y="710" font-size="14" font-style="italic" fill="#000">K_d*  =  K_d(k)  +  d/2  *  (y_− − y_+) / (y_− − 2y_0 + y_+)</text>
  <text x="410" y="728" font-size="11" fill="#555">picks the sub-grid minimum of RMSE</text>

  <!-- arrow from PDE output to RMSE -->
  <line x1="200" y1="626" x2="200" y2="666" stroke="#000" stroke-width="1"/>
  <polygon points="200,670 196,662 204,662" fill="#000"/>

  <!-- T_eq is also needed at the RMSE step; instead of a long dashed path
       through other boxes, note it inline at the RMSE box -->
  <text x="50" y="744" font-size="10" font-style="italic" fill="#555">  (T_eq target enters here from Data Prep)</text>

  <!-- 6.1 -> 6.2 -->
  <line x1="380" y1="705" x2="395" y2="705" stroke="#000" stroke-width="1.1"/>
  <polygon points="395,701 403,705 395,709" fill="#000"/>

  <!-- =============== LEVEL 6: UNCERTAINTY =============== -->
  <text x="40" y="775" font-size="12" font-weight="700" fill="#555">UNCERTAINTY</text>

  <rect x="40"  y="783" width="220" height="78" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="50"  y="801" font-size="12" font-weight="700" fill="#000">Bootstrap</text>
  <text x="50"  y="820" font-size="11" font-style="italic" fill="#000">resample {z_i, T_eq,i} ×1500</text>
  <text x="50"  y="836" font-size="11" font-style="italic" fill="#000">re-fit K_d* on each draw</text>
  <text x="50"  y="852" font-size="11" fill="#555">-> 95% percentile CI</text>

  <rect x="280" y="783" width="220" height="78" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="290" y="801" font-size="12" font-weight="700" fill="#000">Error budget</text>
  <text x="290" y="821" font-size="14" font-style="italic" fill="#000">sigma_tot  =  sqrt( sum  sigma_i^2 )</text>
  <text x="290" y="838" font-size="11" fill="#555">over Q_b, A, K_s, rho, z_b, …</text>
  <text x="290" y="852" font-size="11" fill="#555">chi, H as conditional terms</text>

  <rect x="520" y="783" width="200" height="78" fill="#FFF" stroke="#000" stroke-width="1.4"/>
  <text x="530" y="801" font-size="12" font-weight="700" fill="#000">Contrast + p-value</text>
  <text x="530" y="821" font-size="13" font-style="italic" fill="#000">dK_d  =  K_d*(A17) − K_d*(A15)</text>
  <text x="530" y="838" font-size="11" fill="#555">bootstrap distribution of dK_d</text>
  <text x="530" y="855" font-size="11" font-style="italic" fill="#000">-> p ≈ 0.011</text>

  <!-- arrow from K_d* down -->
  <line x1="560" y1="742" x2="560" y2="780" stroke="#000" stroke-width="1.5"/>
  <polygon points="560,784 556,776 564,776" fill="#000"/>
  <line x1="150" y1="742" x2="150" y2="780" stroke="#000" stroke-width="1"/>
  <polygon points="150,784 146,776 154,776" fill="#000"/>
  <line x1="390" y1="742" x2="390" y2="780" stroke="#000" stroke-width="1"/>
  <polygon points="390,784 386,776 394,776" fill="#000"/>

  <!-- =============== FINAL RESULT =============== -->
  <rect x="40"  y="885" width="680" height="40" fill="#FFF" stroke="#000" stroke-width="1.6"/>
  <text x="380" y="911" font-size="14" font-style="italic" font-weight="700" fill="#000" text-anchor="middle">
    Headline:  K_d*(A15) = 4.58  [4.12, 7.45]      K_d*(A17) = 8.12  [6.85, 9.04]  mW/(m*K)
  </text>

  <line x1="150" y1="861" x2="150" y2="883" stroke="#000" stroke-width="1"/>
  <line x1="380" y1="861" x2="380" y2="883" stroke="#000" stroke-width="1"/>
  <line x1="620" y1="861" x2="620" y2="883" stroke="#000" stroke-width="1"/>
  <polygon points="380,887 376,879 384,879" fill="#000"/>
</svg>
